[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-agent-first"
version = "0.1.0"
description = "Agent-first, Obsidian-compatible local LLM wiki kit with detachable harness bindings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LLM Wiki Agent-First MVP" }]
keywords = ["agent", "wiki", "obsidian", "codex", "claude-code", "openclaw"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
llm-wiki = "llm_wiki.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llm_wiki.resources" = ["**/*"]
